global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "minio"
    scrape_interval: 60s
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "backup_exporter"
    static_configs:
      - targets: ["backup-exporter:8000"]
  
  - job_name: "patroni"
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres1:8008", "postgres2:8008"]

  - job_name: "etcd"
    static_configs:
      - targets: ["etcd:2379"]

  - job_name: "haproxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:8404"]