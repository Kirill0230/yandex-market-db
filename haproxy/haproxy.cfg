global
    maxconn 100

defaults
    mode tcp
    timeout connect 10s
    timeout client 1m
    timeout server 1m

frontend postgres_front
    bind *:5000
    default_backend postgres_back

backend postgres_back
    option httpchk GET /primary
    http-check expect status 200

    server postgres1 postgres1:5432 check port 8008 inter 2s fall 3 rise 2
    server postgres2 postgres2:5432 check port 8008 inter 2s fall 3 rise 2

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /

frontend prometheus
    bind *:8404
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log
